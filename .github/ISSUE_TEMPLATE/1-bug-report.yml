name: aioplaces Bug Report
description: Report a bug in the aioplaces library.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem with aioplaces.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Tell us what you expected to happen and what happened instead.
      placeholder: Describe the issue and how to reproduce it.
    validations:
      required: true
  - type: input
    id: aioplaces-version
    attributes:
      label: aioplaces version
      description: Include the installed package version.
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include a short code sample and the relevant input or response.
      render: python
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or errors
      description: Redact tokens, passwords, addresses, and other private details.
      render: shell
  - type: textarea
    id: additional-details
    attributes:
      label: Additional details
      description: Anything else we need to know?
