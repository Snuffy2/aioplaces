[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aioplaces"
description = "Async Nominatim and Wikidata client with typed place parsing"
requires-python = ">=3.14"
license = "GPL-3.0-only"
authors = [
    { name = "Snuffy2" },
]
dependencies = [
    "aiohttp>=3.13,<4",
    "cachetools>=6",
    "yarl>=1.20",
]
dynamic = ["readme", "version"]
license-files = ["LICENSE"]
keywords = ["nominatim", "openstreetmap", "geocoding", "asyncio", "wikidata"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: GIS",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Snuffy2/aioplaces"
Documentation = "https://aioplaces.readthedocs.io"
Repository = "https://github.com/Snuffy2/aioplaces"
Issues = "https://github.com/Snuffy2/aioplaces/issues"

[project.optional-dependencies]
docs = [
    "sphinx>=9,<10",
    "sphinx-rtd-theme>=3,<4",
    "myst-parser>=5,<6",
]

[dependency-groups]
lint = [
    "mypy",
    "prek",
    "ruff",
    "types-cachetools>=6",
    "uv",
]
pytest = [
    "aioresponses>=0.7.8",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-timeout",
]
dev = [
    { include-group = "lint" },
    { include-group = "pytest" },
]

build = ["build>=1.3", "setuptools>=77", "wheel", "twine>=6"]

[tool.uv]
required-version = ">=0.11.0"
constraint-dependencies = [
    "certifi>=2026.10.19",
    "multidict>=6.9.1",
    "urllib3>=2.8.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["aioplaces*"]

[tool.setuptools.package-data]
aioplaces = ["py.typed"]

[tool.setuptools.dynamic]
readme = { file = ["README.md", "CHANGELOG.md"], content-type = "text/markdown" }
version = { attr = "aioplaces.const.VERSION" }

[tool.coverage.run]
branch = true
source = ["aioplaces"]
relative_files = true
parallel = false

[tool.pytest.ini_options]
addopts = """
  --quiet
  --timeout=20
  --durations=10
  -o console_output_style=progress
  --cov=aioplaces
  --cov-report=term-missing
  --cov-report=html
"""
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
line-length = 100
indent-width = 4
fix = true
force-exclude = true
target-version = "py314"
required-version = ">=0.15.0"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "D"]
fixable = ["ALL"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.14"
platform = "linux"
local_partial_types = true
strict_equality = true
no_implicit_optional = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_unused_configs = true
incremental = false
warn_unused_ignores = true
enable_error_code = [
    "deprecated",
    "ignore-without-code",
    "redundant-self",
    "truthy-iterable",
]
disable_error_code = ["annotation-unchecked"]
extra_checks = false
mypy_path = ["src"]
explicit_package_bases = true
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_subclassing_any = false
disallow_untyped_calls = true
disallow_untyped_decorators = false
disallow_untyped_defs = true
warn_return_any = false
warn_unreachable = false

[[tool.mypy.overrides]]
module = "tests.*"
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
disable_error_code = [
    "import-untyped",
    "arg-type",
    "method-assign",
    "no-untyped-def",
    "index",
    "union-attr",
    "operator",
]
check_untyped_defs = false
warn_unused_ignores = false

[tool.pydoclint]
style = "google"
should-document-private-class-attributes = true
skip-checking-short-docstrings = false
arg-type-hints-in-docstring = true
check-return-types = true
require-return-section-when-returning-nothing = false
allow-init-docstring = true
skip-checking-raises = false
check-class-attributes = false
check-style-mismatch = true
should-document-star-arguments = true
omit-stars-when-documenting-varargs = true
